name: Academy curriculum and offline lab validation

on:
  push:
    paths:
      - 'curriculum.json'
      - 'practice-checkpoints-v1.json'
      - 'lesson-practical-title-map-2026.json'
      - 'coursework-practical-expansion-2026.json'
      - 'coursework-specific-practice-2026.json'
      - 'core-lesson-guided-practice-2026.json'
      - 'core-guided-practice-batch2-2026.json'
      - 'core-guided-practice-batch3-2026.json'
      - 'local-vm-labs/academy_evidence_review.py'
      - 'local-vm-labs/batch5_local_service.py'
      - 'local-vm-labs/batch5_independent_challenge.py'
      - 'local-vm-labs/batch6_local_web_assessment.py'
      - 'local-vm-labs/batch6_security_triage.py'
      - 'tests/**'
      - 'app.js'
      - 'style.css'
      - 'desktop.css'
      - '.github/workflows/academy-curriculum-audit.yml'
  pull_request:
    paths:
      - 'curriculum.json'
      - 'practice-checkpoints-v1.json'
      - 'lesson-practical-title-map-2026.json'
      - '*practice*2026.json'
      - 'local-vm-labs/academy_evidence_review.py'
      - 'local-vm-labs/batch5_local_service.py'
      - 'local-vm-labs/batch5_independent_challenge.py'
      - 'local-vm-labs/batch6_local_web_assessment.py'
      - 'local-vm-labs/batch6_security_triage.py'
      - 'tests/**'
      - 'app.js'
      - 'style.css'
      - 'desktop.css'
      - '.github/workflows/academy-curriculum-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run practical-course mapping audit
        run: python3 tests/audit_practical_mapping.py
      - name: Run Linux evidence review regression tests
        run: python3 -m unittest discover -s tests -p 'test_offline_evidence_review.py' -v
      - name: Run Batch 3 offline real-computer lab regression tests
        run: python3 -m unittest discover -s tests -p 'test_batch3_offline_lab.py' -v
      - name: Run Batch 4 network fault isolation regression tests
        run: python3 -m unittest discover -s tests -p 'test_batch4_fault_isolation.py' -v
      - name: Verify Batch 5 actual loopback HTTP repairs and no-overwrite
        run: python3 -m unittest discover -s tests -p 'test_batch5_local_service.py' -v
      - name: Verify independent first-diagnosis scoring against real loopback requests
        run: python3 -m unittest discover -s tests -p 'test_batch5_independent_challenge.py' -v
      - name: Run Batch 6 actual localhost web assessment integration tests
        run: python3 -m unittest discover -s tests -p 'test_batch6_local_web_assessment.py' -v
      - name: Run Batch 6 synthetic network evidence and prioritization tests
        run: python3 -m unittest discover -s tests -p 'test_batch6_security_triage.py' -v
      - name: Validate main app JavaScript syntax
        run: node --check app.js
      - name: Exercise embedded lesson integration against mock browser
        run: node tests/test_embedded_practice.mjs
      - name: Verify split workstation and local report controls
        run: node tests/test_learning_workstation.mjs
      - name: Validate interactive guided checkpoints
        run: node tests/test_practice_checkpoints.mjs
      - name: Verify Batch 2 practice depth and visible self-checks
        run: node tests/test_batch2_depth.mjs

  batch5-platform-check:
    name: Batch 5 loopback service on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 6
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise real loopback HTTP faults and repairs
        run: python -m unittest discover -s tests -p 'test_batch5_local_service.py' -v
      - name: Exercise independent diagnosis and locked answers
        run: python -m unittest discover -s tests -p 'test_batch5_independent_challenge.py' -v
      - name: Verify real localhost web checks on Windows and Ubuntu
        run: python -m unittest discover -s tests -p 'test_batch6_local_web_assessment.py' -v
      - name: Verify network evidence triage and finding priorities
        run: python -m unittest discover -s tests -p 'test_batch6_security_triage.py' -v
