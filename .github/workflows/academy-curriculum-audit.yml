name: Academy curriculum and offline lab validation

on:
  push:
    paths:
      - 'curriculum.json'
      - 'practice-checkpoints-v1.json'
      - 'lesson-practical-title-map-2026.json'
      - 'coursework-practical-expansion-2026.json'
      - 'coursework-specific-practice-2026.json'
      - 'core-lesson-guided-practice-2026.json'
      - 'core-guided-practice-batch2-2026.json'
      - 'core-guided-practice-batch3-2026.json'
      - 'local-vm-labs/academy_evidence_review.py'
      - 'tests/**'
      - 'app.js'
      - 'style.css'
      - 'desktop.css'
      - '.github/workflows/academy-curriculum-audit.yml'
  pull_request:
    paths:
      - 'curriculum.json'
      - 'practice-checkpoints-v1.json'
      - 'lesson-practical-title-map-2026.json'
      - '*practice*2026.json'
      - 'local-vm-labs/academy_evidence_review.py'
      - 'tests/**'
      - 'app.js'
      - 'style.css'
      - 'desktop.css'
      - '.github/workflows/academy-curriculum-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run practical-course mapping audit
        run: python3 tests/audit_practical_mapping.py
      - name: Run Linux evidence review regression tests
        run: python3 -m unittest discover -s tests -p 'test_offline_evidence_review.py' -v
      - name: Validate main app JavaScript syntax
        run: node --check app.js
      - name: Exercise embedded lesson integration against mock browser
        run: node tests/test_embedded_practice.mjs
      - name: Verify split workstation and local report controls
        run: node tests/test_learning_workstation.mjs
      - name: Validate interactive guided checkpoints
        run: node tests/test_practice_checkpoints.mjs
      - name: Verify Batch 2 practice depth and visible self-checks
        run: node tests/test_batch2_depth.mjs
