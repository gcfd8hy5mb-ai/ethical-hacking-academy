<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Investigation Terminal II · Ethical Hacking Academy</title><style>body{margin:0;background:#f7f2e9;color:#1c3037;font:16px/1.5 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:20px 16px 70px}section{background:white;padding:20px;border:1px solid #d0d7d4;border-radius:14px;margin:18px 0}button,input,select{font:inherit;border:1px solid #aab8bb;border-radius:8px;padding:11px}button{display:block;width:100%;margin:7px 0;text-align:left;background:#edf1f1}button.chosen{background:#d9e9e7;border-color:#287083}button:disabled{opacity:.6}input{box-sizing:border-box;width:100%}pre{background:#162a32;color:#e9f4f3;padding:14px;border-radius:9px;white-space:pre-wrap;word-break:break-word;min-height:110px}small{color:#51656c}.primary{background:#194252;color:white;text-align:center}a{color:#165b76}</style><link rel="stylesheet" href="./practice-unified-theme.css?v=1"></head><body><main><a class="academy-return-link" href="./index.html#practice-lab">← Back to Practice Lab</a><a href="./index.html">← Back to Practice Lab</a><h1>Investigation Terminal II</h1><p>Five independent diagnostic cases. Type approved read-only commands in any order. The lab accepts command aliases and spacing variations; results are synthetic and no command is executed on your device.</p><label for="case">Case</label><select id="case"></select><div id="root"></div></main><script>const cases=[{"title":"Linux service permissions","brief":"A reporting service failed after maintenance. Investigate without changing the system.","commands":[["pwd","/home/student","context"],["systemctl status reports.service","reports.service: failed (exit=1)","service"],["journalctl -u reports.service -n 10","Cannot write /var/reports/out: Permission denied","logs"],["stat /var/reports/out","owner=root; group=reports; mode=750; account=reporter not in reports","permissions"],["df -h /var","/var 40% used","capacity"]],"needed":["logs","permissions"],"diagnoses":["Missing service access to output directory","Filesystem completely full","DNS outage"],"answer":0,"fixes":["Review approved least-privilege access; apply controlled correction","Grant unrestricted access to the entire filesystem","Delete reports"],"fix":0,"verify":["Confirm report output succeeds and unrelated identities remain denied","Check CPU alone","Disable logging"],"valid":0,"lesson":"A permission-denied log together with account/group mismatch identifies a focused access problem. Corroborate after an approved narrow correction."},{"title":"Windows configuration regression","brief":"A test inventory app stopped after a scheduled configuration move.","commands":[["whoami","LAB\\analyst","context"],["Get-Service InventoryApp","Status: Stopped","service"],["Get-WinEvent -FilterHashtable @{LogName='System';Id=7000} -MaxEvents 5","InventoryApp: configuration path not found","events"],["Get-Content C:\\Lab\\change-record.txt","Approved deployment moved configuration to C:\\ProgramData\\Inventory\\cfg","change"],["Get-NetTCPConnection -State Listen","Unrelated services listening normally","network"]],"needed":["events","change"],"diagnoses":["A service dependency has a stale configuration path","Internet is unavailable","CPU failure"],"answer":0,"fixes":["Review the referenced path and apply an approved targeted correction","Delete every Windows log","Disable endpoint defenses"],"fix":0,"verify":["Verify service running and a normal inventory transaction succeeds","Check disk usage only","Verify wallpaper"],"valid":0,"lesson":"Link the event's missing path with the approved change. Validation should include application behavior, not service status alone."},{"title":"DNS troubleshooting","brief":"An authorized synthetic workstation cannot reach portal.example.test.","commands":[["ip route","default via 192.0.2.1","route"],["nslookup portal.example.test 192.0.2.53","Request timed out","primary"],["nslookup portal.example.test 192.0.2.54","Name: portal.example.test; Address: 192.0.2.90","alternate"],["curl -I http://192.0.2.90","HTTP/1.1 200 OK (synthetic endpoint)","http"],["ip addr","inet 192.0.2.20/24","interface"]],"needed":["primary","alternate"],"diagnoses":["Primary resolver likely failing or unreachable","No network interface configured","Web service is definitively down"],"answer":0,"fixes":["Review resolver health and approved workstation settings","Disable all firewalls","Delete local system files"],"fix":0,"verify":["Repeat hostname resolution and end-to-end portal request","Run unrelated application","Verify only local clock"],"valid":0,"lesson":"Contrasting resolver results isolate a probable DNS issue. Retest hostname access after correction."},{"title":"Linux storage exhaustion","brief":"A fictional build service reports 'No space left on device', though disk usage is low.","commands":[["df -h /var","/var blocks 39% used","blocks"],["df -i /var","/var inodes 100% used","inodes"],["journalctl -u builder -n 10","Cannot create new file: No space left on device","logs"],["du -sh /var/cache/build","1.2G synthetic cached build files","cache"],["id","uid=1000(student)","identity"]],"needed":["inodes","logs"],"diagnoses":["Inode exhaustion, not disk block capacity","Total loss of networking","Expired TLS certificate"],"answer":0,"fixes":["Review retention and safely remove only approved disposable files","Delete unrelated home directories","Disable audit records"],"fix":0,"verify":["Confirm inode availability and a controlled file creation succeeds","Check only disk blocks","Check DNS"],"valid":0,"lesson":"A filesystem can run out of inodes before running out of bytes. Review disposal policy before deleting data."}];const store='ethical-hacking-investigation-terminal-v2';let progress={};try{progress=JSON.parse(localStorage.getItem(store)||'{}')}catch{}const list=document.querySelector('#case'),root=document.querySelector('#root');cases.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c.title;list.append(o)});let index=0,seen=[],history=[],diagnosis=-1,fix=-1,valid=-1,graded=false;const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');function normalized(s){return s.trim().replace(/\s+/g,' ').toLowerCase()}function points(c){return c.needed.filter(id=>seen.includes(id)).length*2+Number(diagnosis===c.answer)*2+Number(fix===c.fix)*2+Number(valid===c.valid)*2}function options(items,kind,selected){return items.map((x,i)=>'<button data-kind="'+kind+'" data-index="'+i+'" class="'+(i===selected?'chosen':'')+'" '+(graded?'disabled':'')+'>'+esc(x)+'</button>').join('')}function paint(){const c=cases[index];root.innerHTML='<section><h2>'+esc(c.title)+'</h2><p>'+esc(c.brief)+'</p><p><small>Choose up to three different observations. Only the two most relevant observations earn evidence points. Type <code>help</code> to display allowed commands.</small></p><input aria-label="Terminal command" id="cmd" placeholder="Type a diagnostic command" autocomplete="off" '+(graded?'disabled':'')+'><button class="primary" id="run" '+(graded?'disabled':'')+'>Run mock command</button><pre aria-live="polite">'+esc(history.length?history.join('\n\n'):'student@lab:~$')+'</pre><p><small>Distinct observations: '+seen.length+'/3 · Best recorded score: '+Number(progress[index]||0)+'/10</small></p><h3>Diagnosis</h3>'+options(c.diagnoses,'diagnosis',diagnosis)+'<h3>Recommended correction</h3>'+options(c.fixes,'fix',fix)+'<h3>Verification</h3>'+options(c.verify,'valid',valid)+(graded?'<h3>Score: '+points(c)+'/10</h3><p>'+esc(c.lesson)+'</p><button id="retry">Retry this case</button>':'<button class="primary" id="grade" '+(seen.length<2||diagnosis<0||fix<0||valid<0?'disabled':'')+'>Grade the investigation</button>')+'</section>'}function runCommand(){if(graded)return;const input=root.querySelector('#cmd'),c=cases[index],raw=input.value,cmd=normalized(raw);if(!cmd)return;if(cmd==='help'||cmd==='?'){history.push('$ '+raw+'\nAllowed: '+c.commands.map(x=>x[0]).join(' | '));paint();return}const n=c.commands.findIndex(x=>normalized(x[0])===cmd);if(n<0){history.push('$ '+raw+'\nUnsupported in this mock environment. Type help.');paint();return}const [name,out,id]=c.commands[n];if(!seen.includes(id)&&seen.length>=3){history.push('$ '+raw+'\nEvidence budget reached (three unique records).');paint();return}if(!seen.includes(id))seen.push(id);history.push('$ '+name+'\n'+out);paint()}root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='run'){runCommand();return}if(b.id==='retry'){seen=[];history=[];diagnosis=fix=valid=-1;graded=false;paint();return}if(b.id==='grade'&&!graded&&seen.length>=2&&diagnosis>=0&&fix>=0&&valid>=0){graded=true;progress[index]=Math.max(Number(progress[index]||0),points(cases[index]));try{localStorage.setItem(store,JSON.stringify(progress))}catch{}paint();return}if(graded)return;const n=Number(b.dataset.index);if(b.dataset.kind==='diagnosis')diagnosis=n;else if(b.dataset.kind==='fix')fix=n;else if(b.dataset.kind==='valid')valid=n;else return;paint()});root.addEventListener('keydown',e=>{if(e.target.id==='cmd'&&e.key==='Enter'){e.preventDefault();runCommand()}});list.addEventListener('change',()=>{index=Number(list.value);seen=[];history=[];diagnosis=fix=valid=-1;graded=false;paint()});paint();</script></body></html>
