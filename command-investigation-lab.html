<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Command-Line Investigation Lab</title><style>body{margin:0;background:#f7f2e9;color:#1b2a33;font:16px/1.5 system-ui,sans-serif}main{max-width:800px;margin:auto;padding:20px}section{background:white;border:1px solid #cdd5d6;border-radius:14px;padding:18px;margin:15px 0}button,input{font:inherit;padding:12px;border:1px solid #a8b8bb;border-radius:8px}button{display:block;width:100%;text-align:left;margin:7px 0;background:#f2f6f6}button.selected{background:#d2e8e5}button:disabled{opacity:.6}input{box-sizing:border-box;width:100%}pre{background:#1b2d35;color:#eaf4f3;white-space:pre-wrap;padding:14px;border-radius:10px;min-height:90px}a{color:#14627b}</style><link rel="stylesheet" href="./practice-unified-theme.css?v=1"></head><body><main><a class="academy-return-link" href="./index.html#practice-lab">← Back to Practice Lab</a><a href="./index.html">← Academy</a><h1>Command-Line Investigation Lab</h1><p>Type read-only diagnostic commands against fictional systems. Only explicitly listed commands are recognized. Nothing is executed on your computer or over a network.</p><div id="root"></div></main><script>const cases=[{"title":"Linux report service failure","brief":"A fictional reporting service fails after a directory ownership change.","commands":[["systemctl status reports.service","reports.service failed (exit=1)"],["journalctl -u reports.service -n 10","Cannot write /var/reports/out: Permission denied"],["stat /var/reports/out","owner=root group=reports mode=750; service user=reporter not in reports"],["df -h /var","Filesystem 40% used"]],"required":[1,2],"diagnoses":["Permission mismatch blocks service account","Filesystem full","DNS offline"],"diagnosis":0,"actions":["Review and restore approved directory access, then restart in maintenance window","chmod -R 777 /var","Delete application records"],"action":0,"verification":["Confirm authorized service can write and produce a report; unrelated accounts remain denied","Only check server uptime","Disable auditing"],"verify":0,"reason":"The journal's permission error and ownership metadata support a narrow access mismatch. Resolve using least privilege, not global permissions."},{"title":"Windows service after deployment","brief":"A fictional Windows inventory service is not starting following an approved release.","commands":[["Get-Service InventoryApp","InventoryApp Stopped"],["Get-WinEvent -FilterHashtable @{LogName='System';Id=7000} -MaxEvents 5","InventoryApp could not start: configuration path not found"],["Get-Content C:\\Lab\\change-record.txt","Release moved configuration from C:\\App\\cfg to C:\\ProgramData\\Inventory\\cfg"],["Get-NetTCPConnection -State Listen","Other application listeners healthy"]],"required":[1,2],"diagnoses":["Outdated path in service configuration","Confirmed compromise","All TCP is blocked"],"diagnosis":0,"actions":["Review and correct the authorized dependency path with rollback and change approval","Disable all Windows services","Delete the event log"],"action":0,"verification":["Confirm service running and approved inventory transaction works","Check desktop wallpaper","Disable antivirus"],"verify":0,"reason":"Event ID and deployment record align on a missing path; verification includes the business function, not only service status."},{"title":"DNS failure isolation","brief":"A fictional training client has a valid IP address but fails to open the training portal.","commands":[["ip route","default via 192.0.2.1 dev eth0"],["nslookup portal.example.test 192.0.2.53","connection timed out"],["nslookup portal.example.test 192.0.2.54","Name: portal.example.test; Address: 192.0.2.90"],["curl -I http://192.0.2.90","HTTP/1.1 200 OK (approved synthetic lab host)"]],"required":[1,2],"diagnoses":["Configured DNS resolver is likely unhealthy or unreachable","The server cannot return HTTP","All routing is broken"],"diagnosis":0,"actions":["Investigate resolver health and correct approved client configuration","Turn off all firewalls","Reinstall every workstation"],"action":0,"verification":["Retest name resolution via intended resolver and hostname HTTP transaction","Check a printer","Disable DNS logs"],"verify":0,"reason":"A failing configured resolver and functioning alternate resolver narrow the issue to DNS. Direct IP success gives additional context but does not alone fix hostname routing."}];const key='ethical-hacking-command-investigations-v1';let current=0,seen=[],diagnosis=-1,action=-1,verify=-1,done=false;const root=document.querySelector('#root');let best={};try{best=JSON.parse(localStorage.getItem(key)||'{}')}catch{}function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function options(arr,k,selected){return arr.map((v,i)=>'<button data-kind="'+k+'" data-i="'+i+'" class="'+(selected===i?'selected':'')+'" '+(done?'disabled':'')+'>'+esc(v)+'</button>').join('')}function score(c){return 2*seen.filter(i=>c.required.includes(i)).length+2*Number(diagnosis===c.diagnosis)+2*Number(action===c.action)+2*Number(verify===c.verify)}function paint(){const c=cases[current];root.innerHTML='<section><p>Lab '+(current+1)+' of '+cases.length+'</p><h2>'+esc(c.title)+'</h2><p>'+esc(c.brief)+'</p><h3>Diagnostic terminal</h3><p>Type up to two commands. Available commands:</p><p>'+c.commands.map(x=>'<code>'+esc(x[0])+'</code>').join(' · ')+'</p><input id="command" aria-label="Diagnostic command" autocomplete="off" placeholder="Type a listed command" '+(seen.length>=2||done?'disabled':'')+'><button id="run" '+(seen.length>=2||done?'disabled':'')+'>Run simulated command</button><pre>'+esc(seen.length?seen.map(i=>'$ '+c.commands[i][0]+'\n'+c.commands[i][1]).join('\n\n'):'No evidence requested')+'</pre><p>'+seen.length+'/2 observations used</p><h3>Diagnosis</h3>'+options(c.diagnoses,'diagnosis',diagnosis)+'<h3>Safe next action</h3>'+options(c.actions,'action',action)+'<h3>Verify resolution</h3>'+options(c.verification,'verify',verify)+(done?'<h3>Result: '+score(c)+'/10</h3><p>'+esc(c.reason)+'</p><button id="next">Next or restart</button>':'<button id="grade" '+(seen.length!==2||diagnosis<0||action<0||verify<0?'disabled':'')+'>Grade this investigation</button>')+'</section>'}root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='run'&&!done&&seen.length<2){const input=root.querySelector('#command');const command=input.value.trim().replace(/\s+/g,' ');const idx=cases[current].commands.findIndex(x=>x[0]===command);if(idx<0){input.setCustomValidity('Use one of the exact listed read-only commands');input.reportValidity();return}if(!seen.includes(idx))seen.push(idx);paint();return}if(b.id==='grade'&&!done&&seen.length===2&&diagnosis>=0&&action>=0&&verify>=0){done=true;best[current]=Math.max(Number(best[current]||0),score(cases[current]));try{localStorage.setItem(key,JSON.stringify(best))}catch{}paint();return}if(b.id==='next'&&done){current=(current+1)%cases.length;seen=[];diagnosis=action=verify=-1;done=false;paint();return}if(done)return;const n=Number(b.dataset.i);if(b.dataset.kind==='diagnosis')diagnosis=n;else if(b.dataset.kind==='action')action=n;else if(b.dataset.kind==='verify')verify=n;else return;paint()});root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='command'){e.preventDefault();const b=root.querySelector('#run');if(b&&!b.disabled)b.click()}});paint();</script></body></html>
