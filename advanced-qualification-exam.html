<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced Practical Qualification · Ethical Hacking Academy</title><style>body{margin:0;background:#f7f2e9;color:#1d2d34;font:16px/1.55 system-ui,sans-serif}main{max-width:860px;margin:auto;padding:20px 16px 65px}section{background:#fff;border:1px solid #d1d8dc;border-radius:14px;padding:20px;margin:20px 0}button{width:100%;text-align:left;background:#f1f5f6;border:1px solid #afbdc4;border-radius:9px;padding:12px;margin:7px 0;font:inherit}button.sel{background:#d1e9e7;border-color:#1b6c7b}button.primary{background:#203d49;color:white;text-align:center}button:disabled{opacity:.6}pre{white-space:pre-wrap;background:#182e36;color:#e3f6f2;padding:14px;border-radius:10px}textarea{width:100%;box-sizing:border-box;font:inherit;padding:12px;min-height:120px}a{color:#165a70}</style></head><body><main><a href="./index.html">← Academy</a><h1>Advanced Practical Qualification — Part II</h1><p>Three new synthetic investigations covering Windows, networking, and incident response. Selection scoring is objective, but written explanations are not semantically graded. This is not an official certification or real-host proficiency test.</p><div id="root"></div></main><script>const cases=[{"title":"Windows event and dependency correlation","brief":"A synthetic finance reporting service stopped after approved maintenance.","sources":[["events","14:03 Service Control Manager reports missing configuration path"],["change","13:58 application configuration directory renamed in approved change"],["network","Database host reachable"],["disk","55% free"]],"critical":[0,1],"diagnoses":["The approved change left a stale dependency path","Disk exhaustion","Confirmed malware compromise"],"correct":0,"actions":["Review configuration diff, restore correct path through change control, preserve logs","Disable endpoint protection","Delete user files"],"action":0,"tests":["Confirm service active and approved report generation works","Confirm desktop theme unchanged","Only check network ping"],"test":0,"reason":"Change correlation supports but does not conclusively prove causation. Validate the dependency path and successful business transaction."},{"title":"DNS failure versus application outage","brief":"An authorized fictional training client cannot open an internal portal.","sources":[["dns","Configured resolver 192.0.2.53 times out for portal.example.test"],["comparison","Second lab resolver answers portal.example.test correctly"],["gateway","Gateway responds"],["status","Portal health check passed from another authorized subnet"]],"critical":[0,1],"diagnoses":["Configured DNS resolver is the likely failure point","All application servers have failed","Internet transport is definitely broken"],"correct":0,"actions":["Verify resolver configuration with network owner, correct approved settings, retest","Disable firewall globally","Reinstall all devices"],"action":0,"tests":["Confirm name resolution and HTTPS response from affected client","Confirm keyboard lights work","Check unrelated printer"],"test":0,"reason":"The contrast between resolver results isolates DNS as the leading hypothesis; preserve uncertainty until end-to-end validation."},{"title":"Incident containment and evidence integrity","brief":"A fictional security operations team notices unusual administrative sign-ins and must choose proportionate steps.","sources":[["auth","New administrator login from unusual IP at 03:10"],["owner","Account owner confirms no planned overnight change"],["logs","Authentication and activity records preserved with timestamps"],["cpu","Workstation CPU usage normal"]],"critical":[0,1],"diagnoses":["Potential unauthorized use requiring urgent corroboration","Confirmed ransomware infection","Routine patching conclusively established"],"correct":0,"actions":["Escalate, preserve evidence and apply approved reversible session containment","Publish account password","Wipe server without preserving evidence"],"action":0,"tests":["Verify sessions revoked, audit integrity retained and authorized access restored","Confirm desktop wallpaper","Ignore future alerts"],"test":0,"reason":"Unusual sign-in plus owner denial raises concern but does not establish full scope. Controlled response protects evidence and continuity."}];const key='ethical-hacking-qualification-exam-part2-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{}let current=0,completed=[],sources=[],diagnosis=-1,action=-1,test=-1,note='',locked=false;const root=document.querySelector('#root');const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const score=c=>2*sources.filter(i=>c.critical.includes(i)).length+2*Number(diagnosis===c.correct)+2*Number(action===c.action)+2*Number(test===c.test);function choices(a,val,k){return a.map((x,i)=>'<button data-kind="'+k+'" data-i="'+i+'" class="'+(i===val?'sel':'')+'" '+(locked?'disabled':'')+'>'+esc(x)+'</button>').join('')}function end(){const sum=completed.reduce((n,x)=>n+x,0),pass=sum>=24&&completed.every(x=>x>=6);saved.best=Math.max(Number(saved.best)||0,sum);saved.passed=Boolean(saved.passed||pass);saved.last=sum;try{localStorage.setItem(key,JSON.stringify(saved))}catch{}root.innerHTML='<section><h2>Objective results</h2><p><strong>'+sum+'/30 — '+(pass?'Simulation pass':'Review required')+'</strong></p><p>Pass: at least 24/30 overall AND at least 6/10 in every case.</p>'+completed.map((x,i)=>'<p>'+esc(cases[i].title)+': '+x+'/10</p>').join('')+'<p>Best score saved on this device: '+saved.best+'/30</p><p>No evaluated free-text writing or hands-on machine assessment. This is not a certification.</p><button class="primary" id="restart">Retake Part II</button></section>'}function paint(){if(current===cases.length){end();return}const c=cases[current];root.innerHTML='<section><p>Case '+(current+1)+' of 3</p><h2>'+esc(c.title)+'</h2><p>'+esc(c.brief)+'</p><h3>1. Open two evidence records</h3>'+c.sources.map((x,i)=>'<button data-kind="source" data-i="'+i+'" '+(locked||sources.length>=2||sources.includes(i)?'disabled':'')+'>'+esc(x[0])+'</button>').join('')+'<pre>'+(sources.length?sources.map(i=>esc(c.sources[i][0]+': '+c.sources[i][1])).join('\n\n'):'Choose two sources')+'</pre><h3>2. Diagnose</h3>'+choices(c.diagnoses,diagnosis,'diagnosis')+'<h3>3. Propose a safe response</h3>'+choices(c.actions,action,'action')+'<h3>4. Select a verification test</h3>'+choices(c.tests,test,'test')+'<h3>5. Written evidence rationale</h3><textarea id="note" '+(locked?'disabled':'')+' placeholder="Evidence, alternate hypothesis, impact, safe next step, and verification">'+esc(note)+'</textarea><p>Minimum 100 characters. Quality is not automatically assessed.</p>'+(locked?'<p><strong>Score '+score(c)+'/10</strong> — '+esc(c.reason)+'</p><button class="primary" id="next">Continue</button>':'<button class="primary" id="submit" '+(sources.length!==2||diagnosis<0||action<0||test<0||note.trim().length<100?'disabled':'')+'>Grade case</button>')+'</section>'}root.addEventListener('input',e=>{if(e.target.id==='note'){note=e.target.value;const b=root.querySelector('#submit');if(b)b.disabled=sources.length!==2||diagnosis<0||action<0||test<0||note.trim().length<100}});root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='restart'){current=0;completed=[];sources=[];diagnosis=action=test=-1;note='';locked=false;paint();return}if(b.id==='next'&&locked){completed.push(score(cases[current]));current++;sources=[];diagnosis=action=test=-1;note='';locked=false;paint();return}if(b.id==='submit'&&!locked&&sources.length===2&&diagnosis>=0&&action>=0&&test>=0&&note.trim().length>=100){locked=true;paint();return}if(locked)return;const i=Number(b.dataset.i);if(b.dataset.kind==='source'&&sources.length<2&&!sources.includes(i))sources.push(i);else if(b.dataset.kind==='diagnosis')diagnosis=i;else if(b.dataset.kind==='action')action=i;else if(b.dataset.kind==='test')test=i;else return;paint()});paint();</script></body></html>
