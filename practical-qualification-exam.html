<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Practical Qualification Exam · Ethical Hacking Academy</title><style>body{margin:0;background:#f7f2e9;color:#1d2c35;font:16px/1.55 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:18px 16px 60px}section{background:#fff;border:1px solid #d4d6d4;border-radius:15px;padding:18px;margin:18px 0}button{font:inherit;border-radius:9px;border:1px solid #b5c1c7;padding:11px 13px;background:#f1f4f4;display:block;width:100%;margin:8px 0;text-align:left}button.selected{background:#d7e6e8;border-color:#23748b}button.primary{background:#203d49;color:white;text-align:center}button:disabled{opacity:.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#172a32;color:#e7f4f1;padding:12px;border-radius:10px}textarea{width:100%;box-sizing:border-box;min-height:110px;padding:12px;font:inherit}small{color:#50636b}a{color:#145b75}.result{background:#e5eef1;padding:12px;border-radius:9px}</style><link rel="stylesheet" href="./practice-unified-theme.css?v=1"></head><body><main><a class="academy-return-link" href="./index.html#practice-lab">← Back to Practice Lab</a><a href="./index.html">← Practice Lab</a><h1>Practical Qualification Exam</h1><p>Independent browser-based simulation. Four fictional investigations. This is an original Academy assessment, not a professional certification, practical equipment examination, or proof of competence on real systems.</p><div id="app"></div></main><script>const cases=[{"title":"Identity lifecycle incident","brief":"A simulated employee leaves, yet a legacy application still accepts a previously issued session.","sources":[["directory","Employee disabled at 10:00"],["token","Existing token not revoked; expiry 12:00"],["api","10:11 protected API accepted the token"],["storage","Storage utilization 35%"]],"critical":[1,2],"diagnoses":["A token revocation gap","Storage exhaustion","Expired TLS certificate"],"diagnosis":0,"actions":["Revoke issued access under approved workflow and review application revocation policy","Disable audit logging","Delete the employee record"],"action":0,"verifications":["Former token denied; current authorized token accepted","User interface color unchanged","Storage usage steady"],"verification":0,"reason":"Account disablement may prevent new authentication without invalidating existing bearer tokens."},{"title":"Linux application startup","brief":"A fictional Linux service starts manually but remains unavailable after reboot.","sources":[["enablement","Unit enabled state: disabled"],["health","Manually started service passes local health check"],["updates","No new packages installed"],["usage","Disk 28% used"]],"critical":[0,1],"diagnoses":["Startup unit not enabled","All disks are full","DNS service compromised"],"diagnosis":0,"actions":["Approve and apply the documented startup policy in the isolated lab","Delete all service logs","Disable firewall globally"],"action":0,"verifications":["Reboot lab VM and verify service plus app health","Check wallpaper","Compare clock formats"],"verification":0,"reason":"The boot-specific failure and successful manual start support an enablement issue, which requires post-reboot verification."},{"title":"Web application tenant boundary","brief":"In a synthetic SaaS app, a tenant A user retrieves an invoice belonging to tenant B.","sources":[["ownership","Invoice B42 belongs to tenant B"],["request","Tenant A authenticated request to B42 returned 200"],["browser","Invoice B42 link hidden for tenant A"],["latency","Response time 40 ms"]],"critical":[0,1],"diagnoses":["Missing server-side object authorization","Slow network","Broken styling only"],"diagnosis":0,"actions":["Enforce per-object tenant authorization at API boundary","Hide link in browser only","Publish invoices"],"action":0,"verifications":["Deny tenant A access to B42 and allow tenant B access","Recheck logo layout","Test homepage only"],"verification":0,"reason":"UI link hiding does not enforce authorization; tenant and object ownership must be checked server-side."},{"title":"Cloud recovery readiness","brief":"A fictional backup job succeeded, but the recovery rehearsal cannot decrypt its archive.","sources":[["restore","Test restoration stopped: recovery key unavailable"],["keys","Encryption key retired; no approved recovery copy documented"],["backup","Backup upload succeeded 02:00"],["network","Recovery gateway responds normally"]],"critical":[0,1],"diagnoses":["Missing key lifecycle recovery plan","Network link definitely down","Backup file is necessarily malware"],"diagnosis":0,"actions":["Escalate approved key recovery and redesign recovery-key retention controls","Publish encryption keys","Disable encryption everywhere"],"action":0,"verifications":["Complete approved sample restore and verify data integrity","Confirm backup email is green","Check unrelated service"],"verification":0,"reason":"Backup completion alone does not prove recovery capability; a verified restore and key availability are essential."}];const key='ethical-hacking-qualification-exam-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{}const root=document.querySelector('#app');let index=0,answers=[],evidence=[],diagnosis=-1,action=-1,verification=-1,reason='',submitted=false;function esc(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function options(arr,value,kind){return arr.map((v,i)=>'<button data-kind="'+kind+'" data-value="'+i+'" class="'+(value===i?'selected':'')+'" '+(submitted?'disabled':'')+'>'+esc(v)+'</button>').join('')}function points(c){return evidence.filter(n=>c.critical.includes(n)).length*2+(diagnosis===c.diagnosis?2:0)+(action===c.action?2:0)+(verification===c.verification?2:0)}function review(){const grades=answers.map((v,i)=>({title:cases[i].title,score:v.score,max:10}));const total=grades.reduce((n,g)=>n+g.score,0);const passed=total>=32&&grades.every(g=>g.score>=6);const before=Number(saved.best||0);saved.best=Math.max(before,total);saved.last=total;saved.pass=Boolean(saved.pass||passed);saved.lastCompletedAt=new Date().toISOString();try{localStorage.setItem(key,JSON.stringify(saved))}catch{}root.innerHTML='<section><h2>Assessment report</h2><p><strong>Total: '+total+'/40 · '+(passed?'Simulated exam passed':'Practice and retake recommended')+'</strong></p><p>Rule: at least 80% overall and at least 6/10 in each investigation.</p>'+grades.map(g=>'<p>'+esc(g.title)+': '+g.score+'/10</p>').join('')+'<p>Best total stored: '+saved.best+'/40</p><p><small>Scoring evaluates fixed selections only. Written explanations are retained for this session but are not semantically graded or independently verified. No official credential is issued.</small></p><button class="primary" id="restart">Retake exam</button></section>'}function render(){if(index===cases.length){review();return}const c=cases[index];root.innerHTML='<section><p><small>Investigation '+(index+1)+' of '+cases.length+'</small></p><h2>'+esc(c.title)+'</h2><p>'+esc(c.brief)+'</p><h3>1 · Choose two evidence sources</h3><p><small>Only two sources can be opened. Correct sources earn up to four points.</small></p>'+c.sources.map((v,i)=>'<button data-kind="source" data-value="'+i+'" '+(submitted||evidence.includes(i)||evidence.length>=2?'disabled':'')+'>'+esc(v[0])+'</button>').join('')+'<pre>'+(evidence.length?evidence.map(i=>esc(c.sources[i][0]+': '+c.sources[i][1])).join('\n\n'):'Evidence not selected')+'</pre><h3>2 · Diagnosis</h3>'+options(c.diagnoses,diagnosis,'diagnosis')+'<h3>3 · Corrective action</h3>'+options(c.actions,action,'action')+'<h3>4 · Verification</h3>'+options(c.verifications,verification,'verification')+'<h3>5 · Explain your reasoning</h3><textarea id="reason" '+(submitted?'disabled':'')+' placeholder="State observed facts, competing hypothesis, corrective action, and how to verify">'+esc(reason)+'</textarea><p><small>100 characters required. Your text is not automatically assessed for accuracy.</small></p>'+(submitted?'<div class="result"><strong>Score: '+points(c)+'/10</strong><p>'+esc(c.reason)+'</p></div><button class="primary" id="next">Continue →</button>':'<button class="primary" id="submit" '+(evidence.length!==2||diagnosis<0||action<0||verification<0||reason.trim().length<100?'disabled':'')+'>Lock answers and grade</button>')+'</section>'}root.addEventListener('input',e=>{if(e.target.id==='reason'){reason=e.target.value;const b=root.querySelector('#submit');if(b)b.disabled=evidence.length!==2||diagnosis<0||action<0||verification<0||reason.trim().length<100}});root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='restart'){index=0;answers=[];evidence=[];diagnosis=action=verification=-1;reason='';submitted=false;render();return}if(b.id==='next'&&submitted){answers.push({score:points(cases[index]),reason:reason});index++;evidence=[];diagnosis=action=verification=-1;reason='';submitted=false;render();return}if(b.id==='submit'&&!submitted&&evidence.length===2&&diagnosis>=0&&action>=0&&verification>=0&&reason.trim().length>=100){submitted=true;render();return}if(submitted)return;const kind=b.dataset.kind,n=Number(b.dataset.value);if(kind==='source'){if(evidence.length<2&&!evidence.includes(n))evidence.push(n)}else if(kind==='diagnosis')diagnosis=n;else if(kind==='action')action=n;else if(kind==='verification')verification=n;else return;render()});render();</script></body></html>
